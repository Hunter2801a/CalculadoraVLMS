<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora VLSM</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
  <header>
    <h1>Calculadora VLSM</h1>
    <p>Escribe la red y los hosts que necesita cada subred. Te devuelve el desarrollo paso a paso del subneteo VLSM, con máscaras, saltos y rangos de cada una.</p>
  </header>

  <div class="layout">
    <form class="panel" id="f" autocomplete="off">
      <div>
        <label for="net">Red actual</label>
        <input type="text" id="net" inputmode="text" spellcheck="false" placeholder="172.16.128.0/17">
        <p class="hint">Acepta <span class="mono">IP/prefijo</span>, <span class="mono">IP máscara</span> o solo la IP (usa la máscara de su clase).</p>
      </div>

      <div>
        <span class="lbl">Hosts por red</span>
        <div class="rows" id="rows"></div>
        <button type="button" class="btn-add" id="add">+ Agregar red</button>
      </div>

      <div class="two">
        <div>
          <label for="links">Enlaces (/30)</label>
          <input type="number" id="links" min="0" max="64" step="1" inputmode="numeric">
        </div>
      </div>

      <label class="check" for="eth">
        <input type="checkbox" id="eth">
        <span>Sumar 1 dirección por la interfaz Ethernet del router en cada red (como en el ejemplo de Clase B).</span>
      </label>

      <div>
        <span class="lbl">Ejemplos con otras redes</span>
        <div class="examples" id="examples"></div>
      </div>
    </form>

    <main class="out" id="out" aria-live="polite"></main>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
